version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860" # default port for gradio server
    volumes:
      - .:/app # Ánh xạ thư mục local vào container
    environment:
      - PYTHONUNBUFFERED=1
      # - PORT=8000
    restart: always

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

volumes:
  ollama:
