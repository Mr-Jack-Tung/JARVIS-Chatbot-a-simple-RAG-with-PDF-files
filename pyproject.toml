[project]
name = "jarvis-assistant"
version = "0.1.7"
description = "JARVIS is a simple RAG chatbot with PDF files"
readme = "README.md"
authors = [{ name = "Mr. Jack Tung", email = "tunglt1618@gmail.com" }]
requires-python = ">=3.11,<=3.13"
dependencies = [
    "tqdm>=4.66.5",
    "pyyaml>=6.0.2",
    "tiktoken>=0.7.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "wikipedia>=1.4.0",
    "arxiv>=2.1.3",
    "gradio>=5.27.0",
    "gradio-toggle>=2.0.2",
    "gradio-client>=1.3.0",
    "groq>=0.11.0",
    "graphviz>=0.20.3",
    "nomic[local]>=3.1.2",
    "langchain>=0.3.0",
    "langchain-nomic>=0.1.3",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.0",
    "langchainhub>=0.1.21",
    "litellm[proxy]>=1.47.1",
    "ollama>=0.4.4",
    "openai>=1.47.0",
    "google-generativeai>=0.8.1",
    "duckduckgo-search>=6.2.12",
    "protobuf>=3.20.3",
    "langchain-ollama>=0.3.2",
    "langchain-groq>=0.3.2",
    "python-dotenv>=1.1.0",
    "httpx==0.27.0",
    "gpt4all>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/Mr-Jack-Tung/JARVIS-Chatbot-a-simple-RAG-with-PDF-files"
Issues   = "https://github.com/Mr-Jack-Tung/JARVIS-Chatbot-a-simple-RAG-with-PDF-files/issues"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
